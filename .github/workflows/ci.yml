name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.19.4"
  OTP_VERSION: "28.1"

jobs:
  test:
    name: Test & Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eve_dmv_test
          POSTGRES_MAX_CONNECTIONS: "200"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libbz2-dev bc erlang-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix deps.compile

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Setup database
        run: |
          MIX_ENV=test mix ecto.create
          MIX_ENV=test mix ecto.migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/eve_dmv_test

      - name: Run tests
        run: MIX_ENV=test mix test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/eve_dmv_test
          WANDERER_KILLS_SSE_URL: http://localhost:4004/api/v1/kills/stream
          WANDERER_KILLS_BASE_URL: http://localhost:4004
          EVE_SSO_CLIENT_ID: test_client_id
          EVE_SSO_CLIENT_SECRET: test_client_secret
          SECRET_KEY_BASE: test_secret_key_base_for_ci_testing_only_not_production
          PIPELINE_ENABLED: false
          MOCK_SSE_SERVER_ENABLED: true

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libbz2-dev bc erlang-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Cache PLT files
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Run Dialyzer
        run: |
          mix dialyzer --format short 2>&1 | tee dialyzer_output.txt || true
          error_count=$(grep -c "^lib/" dialyzer_output.txt || echo "0")
          if [ "$error_count" -gt 0 ]; then
            echo "❌ Dialyzer found $error_count errors"
            cat dialyzer_output.txt
            exit 1
          fi
          echo "✅ Dialyzer passed"
