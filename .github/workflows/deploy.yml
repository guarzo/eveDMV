name: Deploy

on:
  # Manual deployment with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      version:
        description: 'Version tag (leave empty for latest, or specify older version to roll back)'
        required: false
        default: ''

  # Auto-deploy on successful CI to main
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    branches: [main]
    types: [completed]

env:
  DOCKER_IMAGE_NAME: guarzo/evedmv

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    # Only run if CI passed or manual trigger
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')

    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Determine deployment parameters
        id: params
        run: |
          # Set environment (default to production for auto-deploy)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            VERSION="${{ github.event.inputs.version }}"

            # If no version provided, get the most recent tag
            if [ -z "$VERSION" ]; then
              VERSION=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | grep -E "^v[0-9]+" | head -1)
              echo "No version specified, using most recent tag: $VERSION"
            fi
          else
            ENVIRONMENT="production"
            # Get the most recent tag by creation time
            VERSION=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | grep -E "^v[0-9]+" | head -1)
            echo "Using most recent tag by creation time: $VERSION"
          fi

          # If no version found, exit with error
          if [ -z "$VERSION" ]; then
            echo "❌ No version tag found! Cannot deploy without a version tag."
            echo "Please ensure the CI/CD pipeline has created version tags."
            exit 1
          fi

          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          echo "📋 Deployment Parameters:"
          echo "  Environment: $ENVIRONMENT"
          echo "  Version: $VERSION"

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            VERSION="${{ steps.params.outputs.VERSION }}"
            ENVIRONMENT="${{ steps.params.outputs.ENVIRONMENT }}"

            echo "🚀 Deploying to $ENVIRONMENT with version $VERSION"

            # Navigate to the correct directory
            cd /app/wanderer

            # Update the docker-compose-pkmgradegap.yml file with the new version
            if [ -f "docker-compose-pkmgradegap.yml" ]; then
              cp docker-compose-pkmgradegap.yml docker-compose-pkmgradegap.yml.backup

              # Set up trap to restore backup on any failure and clean up on exit
              cleanup() {
                local exit_code=$?
                if [ $exit_code -ne 0 ] && [ -f "docker-compose-pkmgradegap.yml.backup" ]; then
                  echo "⚠️ Deployment failed (exit code: $exit_code), restoring docker-compose-pkmgradegap.yml from backup..."
                  cp docker-compose-pkmgradegap.yml.backup docker-compose-pkmgradegap.yml
                  echo "✅ Backup restored"
                fi
                rm -f docker-compose-pkmgradegap.yml.backup
                exit $exit_code
              }
              trap cleanup EXIT

              # Record original image line for debugging
              ORIGINAL_LINE=$(grep -E "^\s*image:\s*.*guarzo/evedmv:" docker-compose-pkmgradegap.yml || echo "")
              if [ -z "$ORIGINAL_LINE" ]; then
                echo "❌ ERROR: Could not find guarzo/evedmv image line in docker-compose-pkmgradegap.yml"
                echo "File contents:"
                cat docker-compose-pkmgradegap.yml
                exit 1
              fi
              echo "📋 Original image line: $ORIGINAL_LINE"

              # Update the image tag in the docker-compose file
              # This assumes the image line format is like "image: guarzo/evedmv:TAG"
              sed -i "s|image: guarzo/evedmv:.*|image: guarzo/evedmv:$VERSION|" docker-compose-pkmgradegap.yml

              # Verify the sed replacement actually worked
              # Use a permissive grep pattern that allows for whitespace and optional quotes
              if ! grep -qE "^\s*image:\s*['\"]?guarzo/evedmv:${VERSION}['\"]?\s*$" docker-compose-pkmgradegap.yml; then
                echo "❌ ERROR: Failed to update image version in docker-compose-pkmgradegap.yml"
                echo "Expected to find: image: guarzo/evedmv:$VERSION"
                echo "Original line was: $ORIGINAL_LINE"
                echo "Current file contents around image lines:"
                grep -n "image:" docker-compose-pkmgradegap.yml || echo "(no image lines found)"
                exit 1  # Trap will restore backup automatically
              fi

              echo "✅ Updated image to guarzo/evedmv:$VERSION in docker-compose-pkmgradegap.yml"
              echo "📋 New image line: $(grep -E 'guarzo/evedmv:' docker-compose-pkmgradegap.yml)"
            else
              echo "❌ docker-compose-pkmgradegap.yml file not found"
              exit 1
            fi

            echo "🚀 Running compose-manager.sh upgrade evedmv"
            ./compose-manager.sh upgrade evedmv

            echo "✅ Deployment completed successfully!"

      - name: Create deployment record
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            // Create a deployment record
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ steps.params.outputs.ENVIRONMENT }}',
              description: 'Deployed version ${{ steps.params.outputs.VERSION }}',
              auto_merge: false,
              required_contexts: []
            });

            // Check if deployment was created successfully
            // createDeployment can return 202 status when there's a merge conflict or other issue,
            // in which case deployment.data.id would be undefined
            if (!deployment.data.id) {
              console.log('Deployment creation returned:', JSON.stringify(deployment.data));
              core.warning('Could not create deployment record - this does not affect the actual deployment');
              return;
            }

            // Mark deployment as successful
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: 'Deployment completed successfully'
            });

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment to ${{ steps.params.outputs.ENVIRONMENT }} completed successfully!"
            echo "📦 Version: ${{ steps.params.outputs.VERSION }}"
            echo "🔗 Environment: ${{ steps.params.outputs.ENVIRONMENT }}"
          else
            echo "❌ Deployment to ${{ steps.params.outputs.ENVIRONMENT }} failed!"
            echo "📦 Attempted version: ${{ steps.params.outputs.VERSION }}"
          fi
