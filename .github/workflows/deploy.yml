name: Deploy
run-name: ${{ github.event.workflow_run.head_commit.message || format('Manual deploy {0}', github.event.inputs.version || github.sha) }}

on:
  # Auto-deploy after CI passes on main
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

  # Manual deployment (can specify version for rollback)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (leave empty for new release)'
        required: false
        default: ''

env:
  DOCKER_IMAGE_NAME: guarzo/evedmv

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    # Only run if CI passed or manual trigger
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            # Manual deploy with specific version (rollback)
            VERSION="${{ github.event.inputs.version }}"
            BUILD_NEW="false"
          else
            # Create new version tag
            VERSION="v$(date -u +%Y%m%d%H%M%S)"
            BUILD_NEW="true"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NEW=$BUILD_NEW" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION (build new: $BUILD_NEW)"

      - name: Set up Docker Buildx
        if: steps.version.outputs.BUILD_NEW == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Docker image
        if: steps.version.outputs.BUILD_NEW == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push git tag
        if: steps.version.outputs.BUILD_NEW == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            VERSION="${{ steps.version.outputs.VERSION }}"
            echo "🚀 Deploying version $VERSION"

            cd /app/wanderer

            # Update docker-compose-dmv.yml with new version
            if [ -f "docker-compose-dmv.yml" ]; then
              cp docker-compose-dmv.yml docker-compose-dmv.yml.backup

              # Restore on failure
              cleanup() {
                local exit_code=$?
                if [ $exit_code -ne 0 ] && [ -f "docker-compose-dmv.yml.backup" ]; then
                  echo "⚠️ Deployment failed, restoring backup..."
                  cp docker-compose-dmv.yml.backup docker-compose-dmv.yml
                fi
                rm -f docker-compose-dmv.yml.backup
                exit $exit_code
              }
              trap cleanup EXIT

              # Update image version
              sed -i "s|image: guarzo/evedmv:.*|image: guarzo/evedmv:$VERSION|" docker-compose-dmv.yml

              echo "✅ Updated to guarzo/evedmv:$VERSION"
            else
              echo "❌ docker-compose-dmv.yml not found"
              exit 1
            fi

            echo "🚀 Running upgrade..."
            ./compose-manager.sh upgrade evedmv

            echo "✅ Deployment complete!"

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Successfully deployed ${{ steps.version.outputs.VERSION }}"
          else
            echo "❌ Deployment of ${{ steps.version.outputs.VERSION }} failed"
          fi
