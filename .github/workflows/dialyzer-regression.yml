name: Dialyzer Regression Tracking

on:
  push:
    branches: [ main, develop, 'dialyzer-cleanup/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC to track progress
    - cron: '0 2 * * *'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.17.2"
  OTP_VERSION: "27.0"

jobs:
  dialyzer-metrics:
    name: Dialyzer Metrics & Regression Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ env.ELIXIR_VERSION }}
        otp-version: ${{ env.OTP_VERSION }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

    - name: Cache PLT files
      uses: actions/cache@v4
      with:
        path: priv/plts
        key: ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libbz2-dev bc erlang-dev

    - name: Install dependencies
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get
        mix deps.compile

    - name: Generate dialyzer metrics
      id: metrics
      run: |
        chmod +x ./scripts/dialyzer_metrics.sh
        ./scripts/dialyzer_metrics.sh || true
        
        # Extract metrics for GitHub Actions
        if [ -f dialyzer_metrics.json ]; then
          TOTAL_ERRORS=$(jq -r .total_errors dialyzer_metrics.json)
          NET_ERRORS=$(jq -r .net_errors dialyzer_metrics.json)
          echo "total_errors=$TOTAL_ERRORS" >> $GITHUB_OUTPUT
          echo "net_errors=$NET_ERRORS" >> $GITHUB_OUTPUT
        fi

    - name: Upload metrics artifact
      uses: actions/upload-artifact@v4
      with:
        name: dialyzer-metrics
        path: |
          dialyzer_metrics.json
          dialyzer.txt
        retention-days: 90

    - name: Check for regression
      run: |
        # Run the regression test
        mix test test/dialyzer_regression_test.exs

    - name: Comment PR with metrics
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let metrics = {};
          try {
            const metricsJson = fs.readFileSync('dialyzer_metrics.json', 'utf8');
            metrics = JSON.parse(metricsJson);
          } catch (e) {
            console.log('Could not read metrics file');
            return;
          }
          
          const progress = ((metrics.baseline_errors - metrics.total_errors) / 
                           (metrics.baseline_errors - metrics.target_errors) * 100).toFixed(1);
          
          const body = `## 📊 Dialyzer Progress Report
          
          | Metric | Value | Target |
          |--------|-------|--------|
          | Total Errors | ${metrics.total_errors} | ${metrics.target_errors} |
          | Skipped Errors | ${metrics.skipped_errors} | - |
          | Net Errors | ${metrics.net_errors} | - |
          | Progress | ${progress}% | 100% |
          
          **Baseline:** ${metrics.baseline_errors} errors
          **Current:** ${metrics.total_errors} errors (${metrics.baseline_errors - metrics.total_errors} fixed)
          **Remaining:** ${metrics.total_errors - metrics.target_errors} errors to fix
          
          ${metrics.total_errors > metrics.baseline_errors ? '⚠️ **Warning:** Dialyzer errors have increased!' : '✅ No regression detected'}
          `;
          
          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('Dialyzer Progress Report')
          );
          
          if (botComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

    - name: Create issue if regression detected
      if: failure() && github.ref == 'refs/heads/main'
      uses: actions/github-script@v7
      with:
        script: |
          const title = '⚠️ Dialyzer Regression Detected';
          const body = `Dialyzer errors have increased on the main branch.
          
          Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
          
          This issue was automatically created by the Dialyzer Regression workflow.`;
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['bug', 'dialyzer', 'regression']
          });