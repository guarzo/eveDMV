repos:
  - repo: local
    hooks:
      - id: mix-format
        name: Mix Format (Code Formatting)
        entry: mix format
        language: system
        files: \.exs?$
        pass_filenames: false
        stages: [commit]
        
      - id: mix-compile
        name: Mix Compile (Syntax Check)
        entry: bash
        args: ['-c', 'mix compile --warnings-as-errors']
        language: system
        files: \.exs?$
        pass_filenames: false
        stages: [commit]
        
      - id: mix-credo-strict
        name: Mix Credo (Quality Standards)
        entry: bash
        args: ['-c', 'mix credo --strict --max-exit-status=2']
        language: system
        files: \.exs?$
        pass_filenames: false
        stages: [commit]
        
      - id: unused-variables
        name: Check for Unused Variables
        entry: bash
        args: ['-c', 'if mix compile 2>&1 | grep -q "variable.*is unused"; then echo "❌ Unused variables found"; exit 1; fi']
        language: system
        files: \.exs?$
        pass_filenames: false
        stages: [commit]
        
      - id: security-audit
        name: Security Audit (System.cmd check)
        entry: bash
        args: ['-c', 'if grep -r "System\.cmd" lib/ test/ --include="*.ex" --include="*.exs"; then echo "❌ System.cmd usage found (security risk)"; exit 1; fi']
        language: system
        pass_filenames: false
        stages: [commit]
        
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        entry: bash
        args: ['-c', 'find . -name "*.ex" -o -name "*.exs" -o -name "*.md" | xargs sed -i "s/[[:space:]]*$//"']
        language: system
        pass_filenames: false
        stages: [commit]
        
      - id: end-of-file-fixer
        name: Fix End of Files
        entry: bash
        args: ['-c', 'find . -name "*.ex" -o -name "*.exs" | while read f; do [ -s "$f" ] && [ "$(tail -c1 "$f")" != "" ] && echo >> "$f"; done']
        language: system
        pass_filenames: false
        stages: [commit]
        
      - id: large-numbers
        name: Format Large Numbers (Readability)
        entry: bash
        args: ['-c', 'find . -name "*.ex" -exec sed -i "s/\b\([0-9]\{4,\}\)\b/_\1/g; s/_\([0-9]\{3\}\)_/_\1/g; s/\b_//" {} \;']
        language: system
        pass_filenames: false
        stages: [commit]
        
      - id: todo-check
        name: TODO Comment Review
        entry: bash
        args: ['-c', 'TODO_COUNT=$(grep -r "# TODO" lib/ test/ --include="*.ex" --include="*.exs" | wc -l); if [ "$TODO_COUNT" -gt 50 ]; then echo "⚠️  High TODO count: $TODO_COUNT (consider Sprint planning)"; fi']
        language: system
        pass_filenames: false
        stages: [commit]
        always_run: true
        
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
        name: Check YAML Syntax
        stages: [commit]
        
      - id: check-json
        name: Check JSON Syntax  
        stages: [commit]
        
      - id: check-merge-conflict
        name: Check for Merge Conflicts
        stages: [commit]
        
      - id: mixed-line-ending
        name: Mixed Line Ending Check
        stages: [commit]

# Configuration
default_stages: [commit]
fail_fast: false
minimum_pre_commit_version: 2.20.0